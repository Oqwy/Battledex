<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleDex — Battleground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cabinet">
    <div class="screen">
      <header class="screen-header">
        <div class="logo">BATTLEGROUND</div>
        <span class="pill-link is-current">BATTLEDEX</span>
      </header>

      <main class="screen-body">
        <section id="view-battledex" class="view view-battledex">
          <div class="dex-head">
            <h1 class="pixel-title">BATTLEDEX</h1>
            <div class="roster-count"><span id="roster-count-text">0 ON ROSTER</span></div>
          </div>
          <div class="dex-actions">
            <button id="battledex-back-to-fight" type="button" class="ghost-btn" hidden>LAST FIGHT</button>
            <a id="battledex-new-fight" href="index.html" class="fight-btn small">NEW FIGHT</a>
          </div>
          <div id="battledex-grid" class="battledex-grid"></div>
          <div id="battledex-empty" class="battledex-empty" hidden>
            <div class="empty-grid"><span></span><span></span><span></span><span>?</span></div>
            <div class="empty-heading">NO FIGHTERS<br />SAVED YET</div>
            <p>Win a fight and save the art to start your roster.</p>
          </div>
          <button id="battledex-clear" type="button" class="clear-btn" hidden>CLEAR ALL</button>
        </section>
      </main>

      <footer class="screen-footer">CAB NO. 0417 — ARENA ONLINE</footer>
      <div class="crt-overlay" aria-hidden="true"></div>
    </div>
  </div>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div class="confirm-box">
      <div class="confirm-heading">CLEAR ROSTER?</div>
      <p>This deletes every saved fighter. This can't be undone.</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" class="ghost-btn">CANCEL</button>
        <button id="confirm-delete" type="button" class="confirm-delete-btn">DELETE ALL</button>
      </div>
    </div>
  </div>

  <script src="battledex-storage.js"></script>
  <script src="battledex.js"></script>
</body>
</html>
